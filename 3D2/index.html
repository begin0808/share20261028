<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>南大附中社團群島</title>
    <meta name="description" content="國立臺南大學附屬高級中學 115 學年度社團 3D 互動地圖：六座浮空島、50 個社團，即時社課狀態、社團動態、配對測驗與社團護照。" />
    <meta name="theme-color" content="#cfe8f5" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="南大附中社團群島" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="南大附中社團群島｜國立臺南大學附屬高級中學" />
    <meta property="og:description" content="六座漂浮在雲海上的 3D 小島、50 個社團，找到屬於你的那一座。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-Qy8vnLbv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DeK0QQ1d.css">
  </head>
  <body>
    <div id="stage" class="stage"></div>

    <!-- 開場 -->
    <section id="intro" class="intro" aria-labelledby="intro-title">
      <div class="intro-sky" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="intro-card">
        <svg class="intro-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo" /></svg>
        <p class="intro-school">國立臺南大學附屬高級中學・115 學年度</p>
        <h1 id="intro-title">南大附中<br />社團群島</h1>
        <p class="intro-lead">六座漂浮在雲海上的小島，五十個社團在上面等你。<br />點一座島，找到屬於你的那一座。</p>
        <div class="intro-actions">
          <button id="intro-go" class="btn btn-primary" disabled>
            <span class="loading-dots">島嶼升空中</span>
          </button>
          <button id="intro-quiz" class="btn btn-ghost" disabled>先做社團配對測驗</button>
        </div>
        <div class="intro-progress" aria-hidden="true"><i id="intro-bar"></i></div>
      </div>
    </section>

    <!-- 頂部 -->
    <header class="topbar">
      <a class="brand" href="#" id="brand" aria-label="回到群島全景">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo" /></svg>
        <div>
          <h2>南大附中社團群島</h2>
          <p>115 學年度・6 大類 50 個社團</p>
        </div>
      </a>
      <button class="ticker" id="ticker" aria-label="開啟社團即時動態">
        <span class="live-tag">即時動態</span>
        <span class="ticker-text" id="ticker-text">讀取社團動態中…</span>
        <span class="ticker-more" aria-hidden="true">›</span>
      </button>
      <div class="status" id="status">
        <div class="clock">
          <b id="clock-time">--:--<small>:--</small></b>
          <span id="clock-date">—</span>
        </div>
        <div class="wx" id="wx" title="臺南永康即時天氣">
          <span class="wx-icon" id="wx-icon">⛅</span>
          <div><b id="wx-temp">--°C</b><span id="wx-text">讀取天氣中…</span></div>
        </div>
        <div class="session" id="session">
          <span class="dot"></span>
          <div><b id="session-title">社課時間</b><span id="session-sub">—</span></div>
        </div>
      </div>
    </header>

    <!-- 左下導覽卡 -->
    <aside class="guide" id="guide">
      <div class="mascot" aria-hidden="true">☁️</div>
      <div>
        <b id="guide-title">點一座浮空島，開始探索！</b>
        <span class="howto" id="howto"></span>
        <button class="passport-mini" id="passport-mini">
          <span>🎫 社團護照</span><strong id="passport-count">0 / 50</strong>
          <i><em id="passport-bar"></em></i>
        </button>
      </div>
    </aside>

    <!-- 底部工具列 -->
    <nav class="toolbar" aria-label="檢視工具">
      <div class="seg" role="group" aria-label="視角">
        <button class="tb on" data-view="angle" title="斜角全景">🏝️ 全景</button>
        <button class="tb" data-view="top" title="從正上方看">🧭 俯瞰</button>
        <button class="tb" data-view="list" title="文字清單">📋 清單</button>
      </div>
      <div class="seg" role="group" aria-label="工具">
        <button class="tb" id="tb-search" title="搜尋社團（/）">🔍 搜尋</button>
        <button class="tb" id="tb-tour" title="自動一座一座參觀">🎈 導覽</button>
        <button class="tb" id="tb-time" title="切換時間">🕒 <span id="time-label">即時</span></button>
        <button class="tb on" id="tb-labels" title="顯示島名">🏷️ 島名</button>
        <button class="tb" id="tb-tilt" title="微縮移軸特效（較耗效能）">🔬 微縮</button>
        <button class="tb" id="tb-pause" title="暫停動畫">⏸️ <span>暫停</span></button>
      </div>
      <button class="quiz-btn" id="tb-quiz">✨ 社團配對測驗</button>
    </nav>

    <!-- 導覽控制 -->
    <div class="tour-bar" id="tour-bar" hidden>
      <button id="tour-prev" title="上一座（←）">‹</button>
      <span id="tour-name">—</span>
      <button id="tour-play" title="暫停／繼續（空白鍵）">⏸</button>
      <button id="tour-next" title="下一座（→）">›</button>
      <button id="tour-end" title="結束導覽（Esc）">結束</button>
      <i id="tour-progress"></i>
    </div>

    <!-- 側邊面板 -->
    <aside class="panel" id="panel" aria-live="polite" hidden>
      <button class="panel-close" id="panel-close" aria-label="關閉">✕</button>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <!-- 對話框 -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true"></div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="logo" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="31" fill="#cfe8f5" />
        <path d="M10 40c3-2 7-2 9 0 2-3 8-3 10 0 3-2 7-2 9 0 2-2 6-2 8 0 2-1 5-1 8 1v9H10z" fill="#fff" />
        <path d="M15 30h34l-4 5H19z" fill="#9fd06a" />
        <path d="M19 35h26l-8 14-5 6-5-6z" fill="#c99a6b" />
        <path d="M23 35h18l-6 10-3 4-3-4z" fill="#a5744d" />
        <rect x="28" y="20" width="8" height="10" rx="1" fill="#fff4de" />
        <path d="M26.5 20.5 32 15l5.5 5.5z" fill="#cf6a4c" />
        <circle cx="20" cy="27" r="3" fill="#6fb352" />
        <circle cx="44" cy="27" r="3.4" fill="#6fb352" />
        <circle cx="47" cy="14" r="3.5" fill="#e8794a" />
        <path d="M47 18v4" stroke="#8a5a3a" stroke-width="1" />
      </symbol>
    </svg>

  </body>
</html>
